        <!-- TODO: fix first image not triggering when on screen bug -->
        <script>
            const obs = new IntersectionObserver((entries, obs) => {
                entries.forEach( entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add(entry.target.dataset.trigger);
                        obs.unobserve(entry.target);
                    }

                });
            }, { threshold: 1 });

            document.querySelectorAll('[data-trigger]').forEach(el => obs.observe(el));
        </script>
